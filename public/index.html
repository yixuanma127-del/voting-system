<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>作品投票</title>
  <style>
    :root {
      --red:      #C41230;
      --red-dark: #A00E26;
      --gold:     #C4A24E;
      --gold-dim: #A68A3E;
      --surface:  #FAF8F5;
      --white:    #FFFFFF;
      --border:   #E8E2D8;
      --text:     #1C1C1E;
      --text-dim: #88807A;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--surface); color: var(--text); min-height: 100dvh;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }

    /* ═══ Header ═══ */
    .header {
      background: linear-gradient(135deg, #8B0E22 0%, var(--red) 50%, #B01E30 100%);
      padding: 28px 24px 24px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; top: -40px; right: -40px; width: 200px; height: 200px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); pointer-events: none;
    }
    .header::after {
      content: ''; position: absolute; bottom: -30px; left: -30px; width: 160px; height: 160px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.06); pointer-events: none;
    }
    .header-top-bar {
      width: 40px; height: 2px; background: var(--gold); margin: 0 auto 16px; opacity: 0.7;
    }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 2px; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.72); margin-top: 6px; letter-spacing: 0.5px; }

    /* ═══ Container ═══ */
    .container { max-width: 640px; margin: 0 auto; padding: 0 20px; }

    /* ═══ Status banners ═══ */
    .banner {
      text-align: center; padding: 48px 24px; margin: 24px 0; border-radius: 16px;
      background: var(--white); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .banner-success { border-color: rgba(196,18,48,0.15); }
    .banner-success .icon { font-size: 48px; margin-bottom: 14px; }
    .banner-success h3 { font-size: 20px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
    .banner-success p { font-size: 14px; color: var(--text-dim); }
    .banner-info { color: var(--text-dim); }
    .banner-info .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    .banner-info h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    /* ═══ Vote intro block ═══ */
    .vote-intro {
      margin: 20px 0; padding: 24px; text-align: center;
      background: linear-gradient(135deg, rgba(196,18,48,0.04), rgba(196,18,48,0.01));
      border: 1px solid rgba(196,18,48,0.08); border-radius: 16px;
    }
    .vote-intro h2 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 10px; letter-spacing: 0.5px; }
    .vote-rule {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px;
      border: 1px solid rgba(196,162,78,0.35); border-radius: 24px;
      font-size: 13px; color: var(--gold-dim); letter-spacing: 0.5px;
    }
    .vote-rule b { font-weight: 700; color: var(--gold); }

    /* ═══ Vote Grid ═══ */
    .vote-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    @media (min-width: 480px) { .vote-grid { grid-template-columns: repeat(3, 1fr); } }

    .vote-card {
      background: var(--white); border: 1.5px solid transparent; border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      user-select: none; position: relative; box-shadow: var(--shadow-sm);
    }
    .vote-card:active { transform: scale(0.96); }
    .vote-card.selected {
      border-color: var(--red); box-shadow: 0 0 0 3px rgba(196,18,48,0.12), var(--shadow-md);
      transform: translateY(-2px);
    }
    .vote-card.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.3); }

    .vote-card .img-wrap { height: 130px; background: #F5F2ED; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .vote-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .vote-card .img-wrap .no-img { color: #D8D2C8; font-size: 32px; }

    .vote-card .sel-mark {
      position: absolute; top: 10px; right: 10px; min-width: 28px; height: 28px; border-radius: 14px;
      background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center;
      padding: 0 7px; font-size: 13px; font-weight: 700; opacity: 0; transform: scale(0);
      transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      white-space: nowrap;
    }
    .vote-card.selected .sel-mark { opacity: 1; transform: scale(1); }

    .vote-card .info { padding: 14px 12px; }
    .vote-card .info .title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ═══ Bottom bar ═══ */
    .vote-bar {
      position: sticky; bottom: 20px; z-index: 10; margin-top: 20px;
      background: var(--white); padding: 18px 22px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-md);
    }
    .vote-count-wrap { display: flex; align-items: center; gap: 10px; }
    .vote-count {
      width: 32px; height: 32px; border-radius: 50%; background: var(--text);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; transition: background 0.3s;
    }
    .vote-count.active { background: var(--red); }
    .vote-label { font-size: 13px; color: var(--text-dim); }
    .btn-submit {
      padding: 13px 38px; border: none; border-radius: 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; color: #fff; background: linear-gradient(135deg, #8B0E22, var(--red));
      font-family: inherit; letter-spacing: 1px; transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(196,18,48,0.2);
    }
    .btn-submit:disabled { background: #D8D2C8; color: #AAA59D; box-shadow: none; cursor: not-allowed; letter-spacing: 0.5px; }
    .btn-submit:not(:disabled):active { transform: scale(0.97); }

    /* ═══ Footer ═══ */
    .footer { text-align: center; padding: 32px 20px 40px; color: var(--text-dim); font-size: 12px; letter-spacing: 0.5px; }

    /* ═══ States ═══ */
    .state-empty, .state-error { text-align: center; padding: 64px 20px; color: var(--text-dim); font-size: 15px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top-bar"></div>
    <h1>作品投票</h1>
    <p>请为您喜爱的作品投出宝贵一票</p>
  </header>

  <div class="container" id="app">
    <div class="state-empty">加载作品中...</div>
  </div>

  <div class="footer">诚挚感谢您的参与</div>

  <script>
  (function() {
    'use strict';

    var VOTE_LIMIT = 5;
    var allWorks = [];
    var selectedOrder = [];  // 有序数组：第0个=第1名(5分)，第4个=第5名(1分)
    var voterToken = '';

    try {
      voterToken = localStorage.getItem('voter_token') || '';
      if (!voterToken) {
        voterToken = typeof crypto !== 'undefined' && crypto.randomUUID
          ? crypto.randomUUID()
          : 'v' + Date.now() + Math.random().toString(36).slice(2);
        try { localStorage.setItem('voter_token', voterToken); } catch(e) {}
      }
    } catch(e) {
      voterToken = 'v' + Date.now();
    }

    function $(id) { return document.getElementById(id); }

    async function init() {
      var app = $('app');
      if (!app) return;

      try {
        var check = await fetch('/api/voter-check?token=' + encodeURIComponent(voterToken));
        var cd = await check.json();
        if (cd.hasVoted) {
          app.innerHTML = '<div class="banner banner-info"><div class="icon">&#x2705;</div><h3>您已经投过票了</h3><p>每人限投一次，感谢您的参与</p></div>';
          return;
        }
      } catch(e) {}

      try {
        var res = await fetch('/api/works');
        allWorks = await res.json();
      } catch(e) {
        app.innerHTML = '<div class="state-error">&#x26A0; 加载失败，请刷新重试</div>';
        return;
      }

      if (!allWorks || allWorks.length === 0) {
        app.innerHTML = '<div class="state-empty">暂无作品，敬请期待</div>';
        return;
      }

      renderVote(app);
    }

    function renderVote(app) {
      var html = '<div class="vote-intro"><h2>请按排名顺序选择作品</h2><div class="vote-rule">每人限投 <b>1</b> 次&ensp;|&ensp;第1名 <b>5分</b>&ensp;第2名 <b>4分</b>&ensp;第3名 <b>3分</b>&ensp;第4名 <b>2分</b>&ensp;第5名 <b>1分</b></div></div>';
      html += '<div class="vote-grid" id="voteGrid"></div>';
      app.innerHTML = html;

      var grid = $('voteGrid');
      if (!grid) return;
      var gh = '';
      for (var i = 0; i < allWorks.length; i++) {
        var w = allWorks[i];
        gh += '<div class="vote-card" data-vid="' + w.id + '"><div class="img-wrap">' + (w.image_data ? '<img src="' + w.image_data + '" alt="">' : '<span class="no-img">&#x1F5BC;</span>') + '</div><div class="sel-mark"></div><div class="info"><div class="title">' + w.title + '</div></div></div>';
      }
      grid.innerHTML = gh;

      var cards = grid.querySelectorAll('.vote-card');
      for (var j = 0; j < cards.length; j++) {
        cards[j].addEventListener('click', function() { toggle(parseInt(this.dataset.vid)); });
      }

      var bar = document.createElement('div');
      bar.className = 'vote-bar';
      bar.id = 'voteBar';
      bar.innerHTML = '<div class="vote-count-wrap"><div class="vote-count" id="voteCount">0</div><span class="vote-label">已选择 / 需选' + VOTE_LIMIT + '个（点击次序 = 排名）</span></div><button class="btn-submit" id="btnSubmit" disabled>请选择' + VOTE_LIMIT + '个作品</button>';
      document.querySelector('.container').appendChild(bar);

      $('btnSubmit').addEventListener('click', submitVote);
      refreshUI();
    }

    function toggle(id) {
      var idx = selectedOrder.indexOf(id);
      if (idx >= 0) {
        // 取消选择：从数组中移除，后面的排名自动前移
        selectedOrder.splice(idx, 1);
      } else if (selectedOrder.length < VOTE_LIMIT) {
        // 选择：追加到末尾 = 当前最后一个名次
        selectedOrder.push(id);
      }
      refreshUI();
    }

    function rankLabel(i) {
      var ranks = ['第1名', '第2名', '第3名', '第4名', '第5名'];
      return ranks[i] || '';
    }

    function refreshUI() {
      var cards = document.querySelectorAll('.vote-card');
      for (var i = 0; i < cards.length; i++) {
        var id = parseInt(cards[i].dataset.vid);
        var rankIdx = selectedOrder.indexOf(id);
        var isSel = rankIdx >= 0;
        cards[i].classList.toggle('selected', isSel);
        cards[i].classList.toggle('disabled', !isSel && selectedOrder.length >= VOTE_LIMIT);
        var mark = cards[i].querySelector('.sel-mark');
        if (mark) { mark.textContent = isSel ? (rankIdx + 1) : ''; }
      }
      var cnt = $('voteCount');
      if (cnt) { cnt.textContent = selectedOrder.length; cnt.classList.toggle('active', selectedOrder.length > 0); }
      var btn = $('btnSubmit');
      if (btn) {
        btn.disabled = selectedOrder.length !== VOTE_LIMIT;
        btn.textContent = selectedOrder.length === VOTE_LIMIT ? '提交投票' : ('已选 ' + selectedOrder.length + '/' + VOTE_LIMIT);
      }
    }

    async function submitVote() {
      if (selectedOrder.length !== VOTE_LIMIT) return;
      var btn = $('btnSubmit');
      if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }
      try {
        var res = await fetch('/api/vote', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({work_ids:selectedOrder,voter_token:voterToken}) });
        var data = await res.json();
        if (data.error) { if(btn){btn.disabled=false;btn.textContent='提交投票';} return alert(data.error); }
        var bar = $('voteBar'); if(bar) bar.remove();
        var rankNames = ['第1名(5分)', '第2名(4分)', '第3名(3分)', '第4名(2分)', '第5名(1分)'];
        $('app').innerHTML = '<div class="banner banner-success"><div class="icon">&#x1F389;</div><h3>投票成功</h3><p>感谢您的参与</p></div>';
      } catch(e) { if(btn){btn.disabled=false;btn.textContent='提交投票';} alert('网络错误，请重试'); }
    }

    init();
  })();
  </script>
</body>
</html>
