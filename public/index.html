<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>投票评选</title>
  <style>
    :root {
      --page: #fff8ee;
      --surface: #fffdf9;
      --surface-soft: #fff0df;
      --ink: #38271f;
      --muted: #76645a;
      --primary: #d96232;
      --primary-dark: #b9472a;
      --line: #efd8c2;
      --disabled: #d9cfc5;
      --shadow: 0 10px 28px rgba(87, 48, 29, .12);
    }
    * { box-sizing: border-box; }
    html { background: var(--page); -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .hero {
      min-height: 198px;
      padding: max(30px, env(safe-area-inset-top)) clamp(18px, 5vw, 34px) 30px;
      background: var(--primary-dark) url("/assets/warm-vote-header.png") center / cover no-repeat;
      color: #fffdf8;
      border-radius: 0 0 28px 28px;
    }
    .hero-kicker { margin: 0 0 8px; font-size: 15px; font-weight: 650; letter-spacing: .12em; color: #fff0df; }
    .hero h1 { margin: 0; max-width: 15em; font-size: clamp(38px, 10.5vw, 46px); line-height: 1.14; letter-spacing: -.02em; }
    .hero p { margin: 15px 0 0; font-size: clamp(15px, 4vw, 18px); color: #fff7ef; }
    .shell { width: min(100%, 720px); margin: 0 auto; padding: 18px clamp(14px, 4vw, 24px) 116px; }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-top: -36px;
      padding: 10px 6px;
      border: 1px solid rgba(239,216,194,.85);
      border-radius: 20px;
      background: rgba(255,253,249,.97);
      box-shadow: var(--shadow);
    }
    .summary-item { min-width: 0; padding: 2px 8px; }
    .summary-item + .summary-item { border-left: 1px solid var(--line); }
    .summary-main { display: block; font-size: 16px; font-weight: 750; color: var(--ink); white-space: nowrap; }
    .summary-main strong { color: var(--primary-dark); font-size: 21px; }
    .summary-sub { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
    .ranking-link {
      grid-column: 1 / -1;
      justify-self: stretch;
      min-height: 44px;
      margin: 13px 8px 0;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: var(--primary-dark);
      font-weight: 700;
      cursor: pointer;
    }
    .section-title { margin: 27px 2px 14px; font-size: 20px; line-height: 1.3; }
    .section-title::before { content: ""; display: inline-block; width: 5px; height: 24px; margin-right: 9px; border-radius: 4px; background: var(--primary); vertical-align: -5px; }
    .work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .work-card {
      position: relative;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(87,48,29,.05);
    }
    .work-card:focus-visible { outline: 3px solid rgba(217,98,50,.35); outline-offset: 2px; }
    .work-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217,98,50,.13); }
    .work-card.disabled { opacity: .5; }
    .media {
      position: relative;
      aspect-ratio: 1 / .86;
      overflow: hidden;
      background: #f2e6d9;
    }
    .media img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .media-empty { width: 100%; height: 100%; display: grid; place-items: center; padding: 12px; color: var(--muted); font-size: 13px; }
    .selected-mark {
      position: absolute;
      top: 9px;
      right: 9px;
      min-width: 45px;
      height: 30px;
      display: none;
      place-items: center;
      padding: 0 10px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 2px 8px rgba(56,39,31,.22);
    }
    .work-card.selected .selected-mark { display: grid; }
    .work-info { padding: 12px 12px 14px; }
    .work-number { display: block; margin-bottom: 3px; color: var(--primary-dark); font-size: 12px; font-weight: 750; }
    .work-title { display: block; overflow: hidden; font-size: 15px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
    .vote-dock {
      position: fixed;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 13px max(14px, env(safe-area-inset-right)) max(13px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: rgba(255,253,249,.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 24px rgba(87,48,29,.1);
    }
    .dock-inner { width: min(100%, 720px); margin: auto; display: grid; grid-template-columns: auto minmax(150px, 1fr); align-items: center; gap: 16px; }
    .dock-count strong { display: block; font-size: 22px; color: var(--ink); }
    .dock-count strong span { color: var(--primary-dark); }
    .dock-count small { color: var(--muted); font-size: 12px; }
    .submit {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .submit:disabled { background: var(--disabled); color: #766f69; cursor: not-allowed; }
    .state { margin: 22px 0; padding: 36px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); text-align: center; color: var(--muted); }
    .state h2 { margin: 0 0 8px; color: var(--ink); font-size: 21px; }
    .ranking-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 20px; }
    .back-button { min-width: 70px; min-height: 44px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
    .ranking-head h2 { margin: 0; font-size: 21px; }
    .ranking-note { margin: -10px 0 18px; color: var(--muted); font-size: 13px; }
    .ranking-list { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .rank-row { display: grid; grid-template-columns: 42px 48px minmax(0,1fr) auto; align-items: center; gap: 11px; min-height: 68px; padding: 9px 13px; }
    .rank-row + .rank-row { border-top: 1px solid var(--line); }
    .rank-pos { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f5e8db; color: var(--ink); font-weight: 800; }
    .rank-row.top .rank-pos { background: var(--primary); color: #fff; }
    .rank-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #f2e6d9; }
    .rank-name { min-width: 0; overflow: hidden; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
    .rank-votes { color: var(--primary-dark); font-weight: 800; white-space: nowrap; }
    @media (min-width: 360px) {
      .summary { grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(104px,.9fr); align-items: center; }
      .summary-main { font-size: 16px; }
      .summary-sub { font-size: 12px; }
      .ranking-link { grid-column: auto; min-width: 0; margin: 0 4px; border-top: 0; border-left: 1px solid var(--line); }
    }
    @media (min-width: 540px) {
      .work-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 350px) {
      .hero { min-height: 176px; padding-left: 16px; padding-right: 16px; }
      .shell { padding-left: 10px; padding-right: 10px; }
      .summary-item { padding-left: 9px; padding-right: 9px; }
      .summary-main { font-size: 16px; }
      .summary-main strong { font-size: 21px; }
      .work-grid { gap: 9px; }
      .work-info { padding: 10px; }
      .dock-inner { gap: 10px; }
      .submit { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <p class="hero-kicker">投票评选</p>
    <h1 id="eventNameDisplay">活动加载中</h1>
    <p id="heroInstruction">请选择你支持的参选项目</p>
  </header>

  <main class="shell" id="app">
    <div class="state">正在加载活动...</div>
  </main>

  <script>
  (function () {
    'use strict';

    var voteLimit = 1;
    var currentEvent = null;
    var works = [];
    var selectedIds = [];
    var voterToken = '';

    try {
      voterToken = localStorage.getItem('voter_token') || '';
      if (!voterToken) {
        voterToken = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'v' + Date.now() + Math.random().toString(36).slice(2);
        localStorage.setItem('voter_token', voterToken);
      }
    } catch (error) {
      voterToken = 'v' + Date.now() + Math.random().toString(36).slice(2);
    }

    function byId(id) { return document.getElementById(id); }
    function eventIdFromUrl() { return parseInt(new URLSearchParams(location.search).get('event_id'), 10); }
    function canShowResults() { return !!(currentEvent && (currentEvent.is_ended || currentEvent.show_results_after_vote)); }
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    async function init() {
      try {
        var eventsResponse = await fetch('/api/events');
        var events = await eventsResponse.json();
        var requestedId = eventIdFromUrl();
        currentEvent = Number.isInteger(requestedId)
          ? events.find(function (event) { return event.id === requestedId; })
          : events[0];

        if (!currentEvent) {
          byId('eventNameDisplay').textContent = '活动不存在';
          byId('app').innerHTML = '<div class="state"><h2>找不到这个活动</h2><p>活动可能已被删除，请向主办方确认入口链接。</p></div>';
          return;
        }

        voteLimit = parseInt(currentEvent.rank_limit, 10) || 1;
        byId('eventNameDisplay').textContent = currentEvent.name;
        byId('heroInstruction').textContent = '请选择' + voteLimit + '个你支持的项目';

        if (currentEvent.is_ended) {
          await renderRankings('活动已结束');
          return;
        }

        var responses = await Promise.all([
          fetch('/api/works?event_id=' + currentEvent.id),
          fetch('/api/vote-check?token=' + encodeURIComponent(voterToken) + '&event_id=' + currentEvent.id)
        ]);
        works = await responses[0].json();
        var voteState = await responses[1].json();

        if (voteState.hasVoted) {
          renderCompleted();
          return;
        }
        if (works.length < voteLimit) {
          byId('app').innerHTML = '<div class="state"><h2>暂未开始投票</h2><p>当前参选项目不足 ' + voteLimit + ' 个。</p></div>';
          return;
        }
        renderVoting();
      } catch (error) {
        byId('app').innerHTML = '<div class="state"><h2>加载失败</h2><p>请检查网络后刷新重试。</p></div>';
      }
    }

    function renderSummary() {
      return '<section class="summary" aria-label="投票信息">'
        + '<div class="summary-item"><span class="summary-main">已选 <strong id="summaryCount">' + selectedIds.length + '/' + voteLimit + '</strong></span><span class="summary-sub">共 ' + works.length + ' 个参选项目</span></div>'
        + '<div class="summary-item"><span class="summary-main">等权投票</span><span class="summary-sub">每个选择计 1 票</span></div>'
        + (canShowResults() ? '<button type="button" class="ranking-link" id="rankingLink">查看完整排名</button>' : '')
        + '</section>';
    }

    function renderVoting() {
      var cards = works.map(function (work, index) {
        var imageSrc = work.image_url || work.image_data;
        var image = imageSrc
          ? '<img src="' + escapeHtml(imageSrc) + '" alt="" loading="lazy">'
          : '<span class="media-empty">暂无封面</span>';
        return '<button type="button" class="work-card" data-work-id="' + work.id + '" aria-pressed="false">'
          + '<span class="media">' + image + '<span class="selected-mark">已选</span></span>'
          + '<span class="work-info"><span class="work-number">参选 ' + (index + 1) + '</span><span class="work-title">' + escapeHtml(work.title) + '</span></span>'
          + '</button>';
      }).join('');

      byId('app').innerHTML = renderSummary()
        + '<h2 class="section-title">请选择' + voteLimit + '个项目</h2>'
        + '<section class="work-grid" aria-label="参选项目">' + cards + '</section>'
        + '<div class="vote-dock"><div class="dock-inner">'
        + '<div class="dock-count"><strong>已选 <span id="dockCount">' + selectedIds.length + '/' + voteLimit + '</span></strong><small>请选择' + voteLimit + '个项目</small></div>'
        + '<button type="button" class="submit" id="submitVote" disabled>确认投票</button>'
        + '</div></div>';

      var cardElements = document.querySelectorAll('[data-work-id]');
      cardElements.forEach(function (card) {
        card.addEventListener('click', function () { toggleWork(parseInt(card.dataset.workId, 10)); });
      });
      if (byId('rankingLink')) byId('rankingLink').addEventListener('click', function () { renderRankings(); });
      byId('submitVote').addEventListener('click', submitVote);
      refreshSelection();
    }

    function toggleWork(id) {
      var index = selectedIds.indexOf(id);
      if (index >= 0) {
        selectedIds.splice(index, 1);
      } else if (selectedIds.length < voteLimit) {
        selectedIds.push(id);
      }
      refreshSelection();
    }

    function refreshSelection() {
      document.querySelectorAll('[data-work-id]').forEach(function (card) {
        var selected = selectedIds.indexOf(parseInt(card.dataset.workId, 10)) >= 0;
        card.classList.toggle('selected', selected);
        card.classList.toggle('disabled', !selected && selectedIds.length >= voteLimit);
        card.setAttribute('aria-pressed', selected ? 'true' : 'false');
      });
      if (byId('summaryCount')) byId('summaryCount').textContent = selectedIds.length + '/' + voteLimit;
      if (byId('dockCount')) byId('dockCount').textContent = selectedIds.length + '/' + voteLimit;
      if (byId('submitVote')) byId('submitVote').disabled = selectedIds.length !== voteLimit;
    }

    async function submitVote() {
      if (selectedIds.length !== voteLimit) return;
      var submitButton = byId('submitVote');
      submitButton.disabled = true;
      submitButton.textContent = '提交中...';
      try {
        var response = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_id: currentEvent.id, voter_token: voterToken, work_ids: selectedIds })
        });
        var data = await response.json();
        if (!response.ok) throw new Error(data.error || '投票失败');
        renderCompleted();
      } catch (error) {
        alert(error.message || '投票失败，请重试');
        submitButton.disabled = false;
        submitButton.textContent = '确认投票';
      }
    }

    function renderCompleted() {
      var resultButton = canShowResults() ? '<button type="button" class="back-button" id="showRankingAfterVote">查看完整排名</button>' : '';
      var note = canShowResults() ? '感谢参与，每个选择均计 1 票。' : '感谢参与，主办方暂未公开实时排名。';
      byId('app').innerHTML = '<div class="state"><h2>投票已提交</h2><p>' + note + '</p>' + resultButton + '</div>';
      if (byId('showRankingAfterVote')) byId('showRankingAfterVote').addEventListener('click', function () { renderRankings(); });
    }

    async function renderRankings(statusText) {
      try {
        if (!canShowResults()) throw new Error('活动暂未公开投票结果');
        var response = await fetch('/api/results?public=1&event_id=' + currentEvent.id);
        var data = await response.json();
        if (!response.ok) throw new Error(data.error || '排名加载失败');
        works = data.results || [];
        var rows = works.map(function (work, index) {
          var imageSrc = work.image_url || work.image_data;
          var thumb = imageSrc
            ? '<img class="rank-thumb" src="' + escapeHtml(imageSrc) + '" alt="" loading="lazy">'
            : '<span class="rank-thumb"></span>';
          return '<div class="rank-row ' + (index < 3 ? 'top' : '') + '">'
            + '<span class="rank-pos">' + (index + 1) + '</span>'
            + thumb
            + '<span class="rank-name">' + escapeHtml(work.title) + '</span>'
            + '<span class="rank-votes">' + work.score + ' 票</span>'
            + '</div>';
        }).join('');
        byId('app').innerHTML = '<div class="ranking-head"><button type="button" class="back-button" id="backToVote">返回</button><h2>完整排名</h2></div>'
          + '<p class="ranking-note">' + escapeHtml(statusText || '前三名重点标识，其余名次继续完整展示') + '</p>'
          + '<section class="ranking-list">' + (rows || '<div class="state">暂无排名数据</div>') + '</section>';
        byId('backToVote').addEventListener('click', function () {
          if (statusText || currentEvent.is_ended) renderCompleted(); else renderVoting();
        });
      } catch (error) {
        byId('app').innerHTML = '<div class="state"><h2>排名加载失败</h2><p>请稍后重试。</p></div>';
      }
    }

    init();
  })();
  </script>
</body>
</html>
